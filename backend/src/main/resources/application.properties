server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:8KB}
server.tomcat.max-http-form-post-size=${SERVER_MAX_HTTP_FORM_POST_SIZE:1MB}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.request.max-body-size=${MAX_REQUEST_BODY_SIZE:1048576}
app.ai.provider.base-url=${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
app.ai.provider.api-key=${AI_PROVIDER_API_KEY:}
app.ai.provider.model=${AI_PROVIDER_MODEL:gpt-4o-mini}
app.ai.provider.connect-timeout=${AI_PROVIDER_CONNECT_TIMEOUT:3s}
app.ai.provider.response-timeout=${AI_PROVIDER_RESPONSE_TIMEOUT:20s}
